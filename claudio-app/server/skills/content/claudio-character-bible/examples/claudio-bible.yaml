    where: "golden-hour banner, late-night talks"
  - name: studio
    pieces: "sage-green unstructured blazer over a navy-black crew-neck t-shirt"
    where: "headshots, press, about page"
  - name: night-out
    pieces: "olive or black t-shirt, dark rectangular sunglasses, the silver chain"
    where: "club, lounge, balcony"
  - name: desk
