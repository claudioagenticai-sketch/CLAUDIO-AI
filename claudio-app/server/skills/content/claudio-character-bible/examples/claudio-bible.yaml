    beard: "full, thick, groomed dark-brown beard of medium length, slightly lighter moustache"
    eyes: "light blue-grey eyes under strong straight dark-brown brows"
    signature_accessory: "chunky silver chain-link bracelet on one wrist"
    face_and_build: "angular face, defined cheekbones, light freckles, calm closed-lip half-smile; broad, strong, gym-fit build"
  body_and_skin_notes: "broad shoulders, strong arms with light body hair, light warm sun-kissed skin, natural texture with visible pores"
  tattoos_or_marks: "none"
  identity_block_long: "[CLAUDIO ID v1] Claudio, a 35-year-old man (adult, mid-thirties) with a clean shaved head and light stubble; a full, thick, groomed dark-brown beard of medium length with a slightly lighter moustache; light blue-grey eyes; strong straight dark-brown brows; an angular face with defined cheekbones and light freckles; a calm closed-lip half-smile; natural skin texture with visible pores; a broad, strong, gym-fit build; a chunky silver chain-link bracelet on one wrist."
  identity_block_short: "Claudio, 35-year-old man, clean shaved head, full thick dark-brown beard, light blue-grey eyes, strong dark brows, light freckles, broad build, chunky silver chain bracelet, calm half-smile"
  negative_block: "teenager, boyish face, hair on top, receding hairline, ponytail, man bun, blonde, grey beard, patchy beard, goatee, moustache only, clean-shaven, brown eyes, plastic skin, airbrushed, extra fingers, warped hands, text, watermark, logo"

